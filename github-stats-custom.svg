<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <linearGradient id="statsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <filter id="glowStatCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes rankPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px #ff007f); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 18px #ff007f); }
    }
    @keyframes ringSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .rank-badge {
      transform-origin: 345px 115px;
      animation: rankPulse 3s ease-in-out infinite;
    }
    .ring-anim {
      transform-origin: 345px 115px;
      animation: ringSpin 8s linear infinite;
    }
    .font-sans {
      font-family: 'Segoe UI', -apple-system, system-ui, BlinkMacSystemFont, sans-serif;
    }
    .font-mono {
      font-family: 'Fira Code', 'Cascadia Code', monospace;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="416" height="216" rx="14" fill="url(#statsBgGrad)" stroke="url(#cyanBorder)" stroke-width="1.8"/>

  <!-- Card Header -->
  <g transform="translate(24, 32)">
    <circle cx="6" cy="-4" r="5" fill="#00f3ff" filter="url(#glowStatCyan)"/>
    <text x="20" y="0" class="font-sans" font-size="16" font-weight="800" fill="#00f3ff" letter-spacing="0.5">
      ESTADÍSTICAS DE GITHUB
    </text>
  </g>

  <!-- Divider line -->
  <line x1="24" y1="46" x2="396" y2="46" stroke="#1e293b" stroke-width="1"/>

  <!-- Stats Grid -->
  <g transform="translate(24, 75)" class="font-sans">
    <!-- Commits -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="-4" r="3" fill="#00ff9d"/>
      <text x="18" y="0" font-size="13" font-weight="600" fill="#94a3b8">Total Commits:</text>
      <text x="155" y="0" class="font-mono" font-size="13.5" font-weight="800" fill="#00ff9d">1,850+</text>
    </g>

    <!-- PRs -->
    <g transform="translate(0, 30)">
      <circle cx="6" cy="-4" r="3" fill="#00f3ff"/>
      <text x="18" y="0" font-size="13" font-weight="600" fill="#94a3b8">Pull Requests:</text>
      <text x="155" y="0" class="font-mono" font-size="13.5" font-weight="800" fill="#00f3ff">24</text>
    </g>

    <!-- Issues -->
    <g transform="translate(0, 60)">
      <circle cx="6" cy="-4" r="3" fill="#ffb703"/>
      <text x="18" y="0" font-size="13" font-weight="600" fill="#94a3b8">Total Issues:</text>
      <text x="155" y="0" class="font-mono" font-size="13.5" font-weight="800" fill="#ffb703">14</text>
    </g>

    <!-- Repositories -->
    <g transform="translate(0, 90)">
      <circle cx="6" cy="-4" r="3" fill="#a855f7"/>
      <text x="18" y="0" font-size="13" font-weight="600" fill="#94a3b8">Repositorios:</text>
      <text x="155" y="0" class="font-mono" font-size="13.5" font-weight="800" fill="#a855f7">16 Proyectos</text>
    </g>
  </g>

  <!-- Rank Badge Component (Right Side) -->
  <g class="ring-anim">
    <circle cx="345" cy="115" r="42" fill="none" stroke="#ff007f" stroke-width="1.8" stroke-dasharray="8,6" opacity="0.8"/>
    <circle cx="345" cy="115" r="36" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  </g>

  <g class="rank-badge">
    <circle cx="345" cy="115" r="30" fill="#060913" stroke="#ff007f" stroke-width="2"/>
    <text x="345" y="123" text-anchor="middle" class="font-sans" font-size="24" font-weight="900" fill="#ff007f">
      S+
    </text>
  </g>
  <text x="345" y="172" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1">
    GLOBAL RANK
  </text>
</svg>
