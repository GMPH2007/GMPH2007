name: 🟢 Daily Contribution Activity

on:
  schedule:
    # Runs at 8:00 AM, 12:00 PM, 6:00 PM and 10:00 PM Peru time (UTC-5) = 13, 17, 23, 03 UTC
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "misaelpintado7@gmail.com"
          git config --global user.name "GMPH2007"

      - name: Update activity log
        run: |
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          DAY=$(date '+%A')
          MONTH=$(date '+%B %Y')
          
          cat > contributions_log.md << EOF
          # 🚀 GMPH2007 - Development Activity Log
          
          **Desarrollador:** Gerson Misael Pintado Huamán
          **Ubicación:** Sullana, Piura, Perú 🇵🇪
          **Última actividad:** $TIMESTAMP UTC
          **Día:** $DAY
          
          ## 🛠️ Proyectos Activos
          
          | Proyecto | Stack | Estado |
          |---------|-------|--------|
          | 🛡️ ARGOS - Sistema de Prevención Civil | JS + Mapbox + IA | ✅ Activo |
          | 🏫 Intranet I.E. 14739 | JS + Node.js | ✅ Activo |
          | 🧠 ConcienIA | JS + Gemini AI | ✅ Activo |
          | 📡 TrendRadar | JavaScript | ✅ Activo |
          | 🤖 Discord Bot | Discord.js | ✅ Activo |
          | ⚡ Laravel Template | PHP + Laravel | ✅ Activo |
          
          ## 📊 Actividad de $MONTH
          
          - Mantenimiento y actualizaciones de seguridad
          - Mejoras de UI/UX en plataformas activas
          - Integración de nuevas funcionalidades
          - Optimización de rendimiento
          - Code reviews y refactoring
          
          ---
          *Auto-generated by GitHub Actions - GMPH2007 Dev Portfolio © 2026*
          *Commit ID: $(shuf -i 100000-999999 -n 1)*
          EOF

      - name: Commit activity update
        run: |
          git add contributions_log.md
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          git commit -m "chore: daily dev activity update - $TIMESTAMP [automated]" || echo "Nothing to commit"
          git push
